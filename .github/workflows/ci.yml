name: CI

# 로컬 개발은 SQLite(가벼움), 여기서는 실제 PostgreSQL로 돌려서 호환성을 커밋 시점에 잡는다.
# 근거: docs/06_decisions.md #16, docs/08_tech_stack.md §6·§9

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olla
          POSTGRES_PASSWORD: olla
          POSTGRES_DB: olla_care_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-test-secret-key-not-for-production-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://olla:olla@localhost:5432/olla_care_test
      DIAGNOSIS_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync

      - name: pytest — 실제 PostgreSQL로 돌린다
        run: uv run pytest -q

      - name: manage.py check --deploy
        run: uv run python manage.py check --deploy

      - name: pip-audit — 의존성 취약점
        run: uv run pip-audit

      - name: bandit — 파이썬 정적분석
        run: uv run bandit -r apps config -x '*/migrations/*,*/tests.py' -q

      - name: 감사로그 우회 패턴 검사
        run: bash scripts/check_audit_bypass.sh

  frontend:
    # ★ 이 작업이 없던 동안 타입검사·린트는 **누군가의 노트북에서만** 돌았다.
    #   다른 컴퓨터·다른 세션에서 작업하면 조용히 벗어날 수 있는 통로였다.
    #   화면 테스트는 "실패인데 없음으로 보이는 것"을 막는다(docs/06_decisions.md #33).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app-web, admin-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입검사
        run: npx tsc -b

      - name: 린트
        run: npx oxlint

      - name: 화면 테스트
        # admin-web에는 아직 테스트가 없다. 생기면 여기서 자동으로 같이 돈다.
        run: npm run --if-present test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
